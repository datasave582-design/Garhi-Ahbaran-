<script>
let unP=null,MYP=false,VO=true,CG=true,LD=0,LE=0,DP=null,U=null,P=null,C=[],VS=[],CL=[],CH=[],CM=[],PR=[],PL=[],MYR={},openT='c',unR=null,tab='home',open=null,unCM=null;
let PRES=[],DMS=[],dmUser=null,dmUn=null,presTimer=null,unPL=null,POSTS=[],POSTLIKES=[],postUn=null,postLikeUn=null,postCommentsUn=null,myVote=null,myVoteUn=null;
const cnt=id=>0,pl=id=>PL.filter(l=>l.p==id).length,pn=id=>[],MY=()=>myVote&&myVote.c;

const ST={pending:'समीक्षा में',approved:'स्वीकृत',rejected:'अस्वीकृत'};

// Boot the visible app shell immediately. Firebase/network must never be able to keep

auth.onAuthStateChanged(async u=>{U=u;P=null;watchMyVote();if(unR){unR();unR=null}MYR={};if(unP){unP();unP=null}if(unPL){unPL();unPL=null}if(postLikeUn){postLikeUn();postLikeUn=null}MYP=false;PL=[];POSTLIKES=[];if(!u){if(myVoteUn){myVoteUn();myVoteUn=null}myVote=null;clearInterval(presTimer);presTimer=null;hideLoader();shell();return}try{const dr=db.collection('devices').doc(DID),ds=await dr.get();
 if(ds.exists&&ds.data().uid!=u.uid){alert('इस फोन पर पहले से दूसरा खाता जुड़ा है। एक फोन पर एक ही खाता चल सकता है।');return auth.signOut()}
 const d=await db.collection('users').doc(u.uid).get();P=d.exists?d.data():null;if(P)db.collection('profiles').doc(u.uid).set({uid:u.uid,name:P.name,photo:P.photo||'',status:P.profileStatus||'ऑनलाइन हूँ',role:P.role||'user',updatedAt:FV.serverTimestamp()},{merge:true}).catch(()=>{});
 if(P&&P.dev&&P.dev!=DID){P=null;alert('यह खाता दूसरे फोन से जुड़ा है। एडमिन से डिवाइस रीसेट करवाएँ।');return auth.signOut()}
 if(!ds.exists)await dr.set({uid:u.uid,t:FV.serverTimestamp()});startPresence();unP=db.collection('likepick').doc(u.uid).onSnapshot(x=>{MYP=x.exists;upd()},e=>console.error('likepick:',e));unR=db.collection('reacts').where('u','==',u.uid).onSnapshot(x=>{MYR={};x.forEach(d=>{MYR[d.data().c]=d.data().v});upd()},e=>console.error('reacts:',e));unPL=db.collection('plikes').where('u','==',u.uid).onSnapshot(x=>{PL=x.docs.map(d=>({id:d.id,...d.data()}));upd()},e=>console.error('plikes:',e));postLikeUn=db.collection('postLikes').where('u','==',u.uid).onSnapshot(x=>{POSTLIKES=x.docs.map(d=>({id:d.id,...d.data()}));upd()},e=>console.error('postLikes:',e));}catch(e){console.error('Auth/profile:',e);toast('कनेक्शन/प्रोफाइल लोड नहीं हो सकी।');}const lr=localStorage.getItem('loginRole');if(lr){localStorage.removeItem('loginRole');if(!P&&lr=='voter')return shell(),go('regv');if(!P&&lr=='candidate')return shell(),go('reg');}hideLoader();shell()});
